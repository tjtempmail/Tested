name: X659B Firmware Extractor - 7ZIP METHOD

on:
  workflow_dispatch:
    inputs:
      upload_to_github:
        description: 'Create GitHub Release'
        required: false
        default: 'true'
        type: boolean

env:
  FIRMWARE_URL: "https://archive.org/download/infinix-hot-10i-x659b-stock-rom-firmware/R2-Infinix-Hot-10i-X659B-14.zip"
  FIRMWARE_FILENAME: "R2-Infinix-Hot-10i-X659B-14.zip"
  WORK_DIR: ${{ github.workspace }}/firmware_work
  DUMP_DIR: ${{ github.workspace }}/dump_output

jobs:
  firmware-process:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    
    steps:
      - name: Free Up Disk Space
        run: |
          echo "🧹 Freeing up disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean && sudo apt-get autoremove -y
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aria2 p7zip-full p7zip-rar unzip unrar \
            simg2img e2fsprogs file tree pv curl wget \
            python3 python3-pip git cpio xz-utils \
            liblz4-tool brotli binwalk
            
          pip3 install --user protobuf pycryptodome

      - name: Create Working Directories
        run: |
          mkdir -p ${{ env.WORK_DIR }}/extracted_rom
          mkdir -p ${{ env.WORK_DIR }}/super_extracted
          mkdir -p ${{ env.WORK_DIR }}/system_files
          mkdir -p ${{ env.DUMP_DIR }}

      # ERROR FIX: Robust download with Archive.org optimizations
      - name: Download Firmware
        working-directory: ${{ env.WORK_DIR }}
        run: |
          echo "🚀 Downloading firmware..."
          
          cat > aria2.conf << 'EOF'
          max-connection-per-server=4
          min-split-size=50M
          split=4
          max-concurrent-downloads=2
          connect-timeout=120
          timeout=600
          retry-wait=15
          max-tries=10
          continue=true
          max-download-limit=5M
          user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36
          EOF
          
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            aria2c --conf-path=aria2.conf \
              --dir=${{ env.WORK_DIR }} \
              --out=${{ env.FIRMWARE_FILENAME }} \
              "${{ env.FIRMWARE_URL }}" && break
            sleep 30
          done
          
          ls -lh ${{ env.FIRMWARE_FILENAME }}

      # ERROR FIX: Multi-method extraction
      - name: Extract Firmware Archive
        working-directory: ${{ env.WORK_DIR }}
        run: |
          echo "📦 Extracting archive..."
          
          # Try 7z first
          if 7z x ${{ env.FIRMWARE_FILENAME }} -oextracted_rom -y -bb0; then
            echo "✅ 7z extraction successful"
          elif unzip -q ${{ env.FIRMWARE_FILENAME }} -d extracted_rom; then
            echo "✅ unzip successful"
          else
            echo "❌ Extraction failed"
            exit 1
          fi
          
          # Find super.img
          find extracted_rom/ -name "super.img" -type f

      # MAIN METHOD: Use 7zip to extract super.img contents
      - name: Extract Super.img Using 7ZIP
        working-directory: ${{ env.WORK_DIR }}/extracted_rom
        run: |
          echo "🔧 Extracting super.img with 7ZIP..."
          
          SUPER_IMG=$(find . -name "super.img" -type f | head -1)
          if [ -z "$SUPER_IMG" ]; then
            echo "❌ super.img not found"
            exit 1
          fi
          
          echo "Found: $SUPER_IMG ($(ls -lh $SUPER_IMG | awk '{print $5}'))"
          file "$SUPER_IMG"
          
          # Check magic to see if sparse
          MAGIC=$(xxd -l 4 "$SUPER_IMG" | awk '{print $2}')
          echo "Magic bytes: $MAGIC"
          
          # Convert sparse to raw if needed
          if echo "$MAGIC" | grep -qv "3aff"; then
            echo "🔄 Converting sparse to raw..."
            simg2img "$SUPER_IMG" super_raw.img || {
              echo "⚠️ simg2img failed, copying as-is"
              cp "$SUPER_IMG" super_raw.img
            }
          else
            cp "$SUPER_IMG" super_raw.img
          fi
          
          ls -lh super_raw.img
          
          # METHOD 1: Try 7z direct extraction on raw super.img
          echo "📦 Method 1: 7z direct extraction..."
          mkdir -p super_7z_extracted
          7z x super_raw.img -osuper_7z_extracted -y || echo "⚠️ 7z direct extraction had issues"
          
          # Check what we got
          echo "7z extraction results:"
          find super_7z_extracted/ -type f -name "*.img" 2>/dev/null | head -20
          
          # If 7z found internal images, extract them
          if [ -d "super_7z_extracted" ]; then
            # Look for nested images (0.img, 1.img, etc. which are partitions)
            for img in super_7z_extracted/*.img super_7z_extracted/*/*.img; do
              if [ -f "$img" ]; then
                name=$(basename "$img" .img)
                echo "Processing nested image: $name"
                mkdir -p "super_extracted/${name}_files"
                
                # Try to extract this partition image with 7z
                7z x "$img" -o"super_extracted/${name}_files" -y || {
                  # If 7z fails, might be raw ext4, try mount
                  echo "  7z failed, attempting mount..."
                  mkdir -p "super_extracted/${name}_mount"
                  sudo mount -o loop,ro "$img" "super_extracted/${name}_mount" 2>/dev/null && {
                    sudo cp -a "super_extracted/${name}_mount"/* "super_extracted/${name}_files"/
                    sudo umount "super_extracted/${name}_mount"
                  } || echo "  Mount also failed for $name"
                }
              fi
            done
          fi
          
          # METHOD 2: If 7z didn't work well, try binwalk extraction
          if [ ! "$(ls -A super_extracted/ 2>/dev/null)" ]; then
            echo "📦 Method 2: Binwalk extraction..."
            binwalk -e super_raw.img -C super_binwalk/ || true
            
            # Move extracted files
            find super_binwalk/ -name "*.img" -exec cp {} super_extracted/ \; 2>/dev/null || true
          fi
          
          echo "✅ Final extraction results:"
          ls -lhR super_extracted/ | head -50

      # ERROR FIX: Deep extract system partition with 7z fallback
      - name: Deep Extract System Partition
        working-directory: ${{ env.WORK_DIR }}/extracted_rom
        run: |
          echo "🔍 Deep extracting system partition..."
          
          # Find system image (various naming conventions)
          SYSTEM_IMG=$(find super_extracted/ super_7z_extracted/ -name "*system*.img" -o -name "0.img" -o -name "1.img" | head -1)
          
          if [ -z "$SYSTEM_IMG" ]; then
            echo "⚠️ No system image found for deep extraction"
            exit 0
          fi
          
          echo "Found system image: $SYSTEM_IMG ($(ls -lh $SYSTEM_IMG | awk '{print $5}'))"
          file "$SYSTEM_IMG"
          
          # Create output directory
          mkdir -p ${{ env.WORK_DIR }}/system_files
          
          # METHOD 1: Try 7z extraction (works for ext4 images) [^74^][^75^]
          echo "Trying 7z extraction on system image..."
          7z x "$SYSTEM_IMG" -o${{ env.WORK_DIR }}/system_files -y || {
            echo "⚠️ 7z extraction failed, trying mount..."
            
            # METHOD 2: Mount as fallback
            mkdir -p /tmp/system_mount
            if sudo mount -o loop,ro "$SYSTEM_IMG" /tmp/system_mount 2>/dev/null; then
              echo "✅ Mounted, copying files..."
              sudo cp -a /tmp/system_mount/* ${{ env.WORK_DIR }}/system_files/
              sudo umount /tmp/system_mount
            else
              echo "⚠️ Mount failed, trying simg2img + 7z..."
              
              # METHOD 3: Convert if sparse then try 7z again
              simg2img "$SYSTEM_IMG" /tmp/system_raw.img 2>/dev/null && {
                7z x /tmp/system_raw.img -o${{ env.WORK_DIR }}/system_files -y || \
                sudo mount -o loop,ro /tmp/system_raw.img /tmp/system_mount && \
                sudo cp -a /tmp/system_mount/* ${{ env.WORK_DIR }}/system_files/ && \
                sudo umount /tmp/system_mount
              }
            fi
          }
          
          # Count extracted files
          FILE_COUNT=$(find ${{ env.WORK_DIR }}/system_files -type f 2>/dev/null | wc -l)
          echo "✅ Extracted $FILE_COUNT files from system partition"
          
          # List top-level directories
          ls -la ${{ env.WORK_DIR }}/system_files/ | head -20

      # ERROR FIX: Process other partitions
      - name: Extract Vendor and Product Partitions
        working-directory: ${{ env.WORK_DIR }}/extracted_rom
        run: |
          echo "🔧 Extracting vendor and product partitions..."
          
          for part in vendor product system_ext odm; do
            IMG=$(find super_extracted/ super_7z_extracted/ -name "*${part}*.img" | head -1)
            if [ -n "$IMG" ]; then
              echo "Extracting $part from $IMG..."
              mkdir -p ${{ env.WORK_DIR }}/${part}_files
              
              # Try 7z first
              7z x "$IMG" -o${{ env.WORK_DIR }}/${part}_files -y || {
                # Fallback to mount
                mkdir -p /tmp/${part}_mnt
                sudo mount -o loop,ro "$IMG" /tmp/${part}_mnt 2>/dev/null && {
                  sudo cp -a /tmp/${part}_mnt/* ${{ env.WORK_DIR }}/${part}_files/
                  sudo umount /tmp/${part}_mnt
                } || echo "⚠️ Could not extract $part"
              }
            fi
          done

      - name: Setup Phoenix Firmware Dumper
        run: |
          echo "🐦 Setting up Phoenix Dumper..."
          git clone --depth 1 https://github.com/DroidDumps/phoenix_firmware_dumper.git ${{ github.workspace }}/phoenix_dumper
          cd ${{ github.workspace }}/phoenix_dumper
          chmod +x *.sh
          ./setup.sh || echo "⚠️ Setup warnings, continuing..."

      - name: Run Phoenix Firmware Dumper
        working-directory: ${{ github.workspace }}/phoenix_dumper
        run: |
          echo "🚀 Running Phoenix Dumper..."
          
          if [ "${{ github.event.inputs.upload_to_github }}" = "true" ]; then
            echo "${{ secrets.GITHUB_TOKEN }}" > .github_token
            echo "${{ github.repository_owner }}" > .github_orgname
          fi
          
          timeout 3600 ./dumper.sh "${{ env.WORK_DIR }}/extracted_rom" 2>&1 | tee ${{ github.workspace }}/phoenix_dump.log || {
            echo "⚠️ Dumper had issues, using our 7z extraction instead"
          }
          
          cp -r output/* ${{ env.DUMP_DIR }}/ 2>/dev/null || true

      - name: Generate Report
        working-directory: ${{ env.DUMP_DIR }}
        run: |
          cat > X659B_DUMP_REPORT.md << EOF
          # Infinix Hot 10i (X659B) Firmware Dump Report
          
          ## Device Information
          - **Device:** Infinix Hot 10i
          - **Model:** X659B-OP
          - **Codename:** X659B
          - **Chipset:** MediaTek MT6768 (Helio P65)
          - **Android Version:** 11 (API 30)
          - **Extraction Method:** 7ZIP + Mount Fallback
          
          ## Extraction Summary
          - **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Firmware:** ${{ env.FIRMWARE_FILENAME }}
          
          ## Extracted Contents
          EOF
          
          echo "" >> X659B_DUMP_REPORT.md
          echo "### System Partition" >> X659B_DUMP_REPORT.md
          echo "Files: $(find ${{ env.WORK_DIR }}/system_files -type f 2>/dev/null | wc -l)" >> X659B_DUMP_REPORT.md
          echo "" >> X659B_DUMP_REPORT.md
          echo "### Other Partitions" >> X659B_DUMP_REPORT.md
          for part in vendor product system_ext odm; do
            if [ -d "${{ env.WORK_DIR }}/${part}_files" ]; then
              count=$(find ${{ env.WORK_DIR }}/${part}_files -type f 2>/dev/null | wc -l)
              echo "- $part: $count files" >> X659B_DUMP_REPORT.md
            fi
          done
          
          cat X659B_DUMP_REPORT.md

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: X659B-7Zip-Extraction-${{ github.run_number }}
          path: |
            ${{ env.WORK_DIR }}/system_files/
            ${{ env.WORK_DIR }}/vendor_files/
            ${{ env.WORK_DIR }}/product_files/
            ${{ env.WORK_DIR }}/extracted_rom/super_extracted/
            ${{ env.DUMP_DIR }}/
            ${{ github.workspace }}/phoenix_dump.log
          retention-days: 7
          if-no-files-found: warn

      - name: Create Release
        if: github.event.inputs.upload_to_github == 'true' && success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: x659b-7zip-dump-${{ github.run_number }}
          name: X659B 7Zip Extraction #${{ github.run_number }}
          body_path: ${{ env.DUMP_DIR }}/X659B_DUMP_REPORT.md
          files: |
            ${{ env.DUMP_DIR }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: |
          sudo umount /tmp/system_mount /tmp/vendor_mnt /tmp/product_mnt 2>/dev/null || true
          rm -rf ${{ env.WORK_DIR }} || true
          
