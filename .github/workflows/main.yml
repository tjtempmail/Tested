name: Kernel Source Tree Analysis ☠️

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      kernel_url:
        description: 'Kernel Source Git URL'
        required: true
        default: 'https://github.com/SakthivelNadar/android_kernel_redmi_mt6768'

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y tree git
      
      - name: Clone and analyze
        id: analyze
        run: |
          git clone --depth=1 ${{ github.event.inputs.kernel_url }} kernel-source
          cd kernel-source
          
          REPO_NAME=$(basename -s .git ${{ github.event.inputs.kernel_url }})
          echo "repo=$REPO_NAME" >> $GITHUB_OUTPUT
          
          # Generate tree
          tree -L 2 > ../tree.txt
          echo "Analysis complete for $REPO_NAME"
      
      # ==========================================
      # MODERN RELEASE APPROACH (Recommended)
      # ==========================================
      - name: Create Release with Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: kernel-${{ steps.analyze.outputs.repo }}-${{ github.run_number }}
          name: ☠️ Kernel Analysis - ${{ steps.analyze.outputs.repo }}
          body: |
            ## Kernel Tree Analysis
            
            **URL:** ${{ github.event.inputs.kernel_url }}
            **Analyzed:** ${{ github.event.repository.updated_at }}
          files: |
            tree.txt
            *.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
