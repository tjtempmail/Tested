name: Infinix X659B Firmware Dump

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Direct URL to firmware file (zip/ozip/payload.bin)'
        required: true
        default: 'https://archive.org/download/infinix-hot-10i-x659b-stock-rom-firmware/R2-Infinix-Hot-10i-X659B-14.zip'
        type: string
      firmware_type:
        description: 'Firmware file type'
        required: true
        default: 'zip'
        type: choice
        options:
          - zip
          - ozip
          - payload.bin
          - super.img
          - UPDATE.APP
          - pac
          - ofp
          - nb0

env:
  FIRMWARE_URL: ${{ github.event.inputs.firmware_url }}
  FIRMWARE_TYPE: ${{ github.event.inputs.firmware_type }}

jobs:
  dump-firmware:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - name: Download firmware
        run: |
          echo "Downloading firmware from: $FIRMWARE_URL"
          mkdir -p firmware
          cd firmware
          
          # Download with resume support and show progress
          wget --progress=bar:force:noscroll --tries=3 --timeout=60 "$FIRMWARE_URL" -O firmware.${{ env.FIRMWARE_TYPE }} 2>&1 | tail -20
          
          # Verify download
          ls -lh firmware.${{ env.FIRMWARE_TYPE }}
          file firmware.${{ env.FIRMWARE_TYPE }}
          cd ..

      - name: Run Phoenix Firmware Dumper (Docker)
        run: |
          # Pull the Phoenix Firmware Dumper Docker image
          docker pull fr3akyphantom/phoenix_firmware_dumper:latest
          
          # Create output directory
          mkdir -p extracted_firmware
          
          # Run the dumper with the firmware file
          docker run --rm \
            -v "$(pwd)/firmware:/input" \
            -v "$(pwd)/extracted_firmware:/output" \
            fr3akyphantom/phoenix_firmware_dumper:latest \
            /input/firmware.${{ env.FIRMWARE_TYPE }}
          
          # List extracted contents
          echo "=== Extracted Firmware Contents ==="
          ls -la extracted_firmware/
          find extracted_firmware/ -type f -name "*.img" -o -name "*.bin" | head -20

      - name: Organize extracted files
        run: |
          cd extracted_firmware
          
          # Create structured output
          mkdir -p x659b_dump
          
          # Move all image files to organized structure
          find . -name "*.img" -o -name "*.bin" | while read file; do
            mv "$file" x659b_dump/ 2>/dev/null || true
          done
          
          # Create info file
          cat > x659b_dump/README.md << 'EOF'
          # Infinix Hot 10i X659B Firmware Dump
          
          **Device:** Infinix Hot 10i  
          **Model:** X659B  
          **Chipset:** MediaTek MT6768 (Helio P65)  
          **Android Version:** 11 (Go Edition)  
          
          ## Contents
          This firmware dump contains the following partitions:
          - boot.img - Kernel image
          - super.img - System partitions (system, vendor, product)
          - preloader.bin - Bootloader
          - vbmeta.img - Verified boot metadata
          - dtbo.img - Device tree blob
          - And other essential partitions
          
          ## Extraction Method
          Extracted using Phoenix Firmware Dumper (Docker)
          Source: ${{ env.FIRMWARE_URL }}
          
          ## Warning
          These files are for educational and backup purposes only.
          Flashing incorrect firmware may brick your device.
          EOF
          
          ls -la x659b_dump/

      - name: Create release archive
        run: |
          cd extracted_firmware/x659b_dump
          
          # Create compressed archive
          zip -r ../../infinix_x659b_firmware_dump.zip .
          
          # Create tar.gz as alternative
          cd ../..
          tar -czf infinix_x659b_firmware_dump.tar.gz -C extracted_firmware/x659b_dump .
          
          # Generate checksums
          sha256sum infinix_x659b_firmware_dump.zip > checksums.txt
          sha256sum infinix_x659b_firmware_dump.tar.gz >> checksums.txt
          
          ls -lh infinix_x659b_firmware_dump.*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x659b-firmware-dump
          path: |
            extracted_firmware/x659b_dump/
            infinix_x659b_firmware_dump.zip
            infinix_x659b_firmware_dump.tar.gz
            checksums.txt
          retention-days: 5
          compression-level: 0  # Already compressed

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: x659b-dump-${{ github.run_number }}
          name: Infinix Hot 10i X659B Firmware Dump #${{ github.run_number }}
          body: |
            Automated firmware extraction for Infinix Hot 10i X659B
            
            **Source:** ${{ env.FIRMWARE_URL }}
            **Type:** ${{ env.FIRMWARE_TYPE }}
            **Extraction Date:** ${{ github.event.repository.updated_at }}
            
            ### Contents
            - Individual partition images (.img/.bin)
            - ZIP archive of all partitions
            - TAR.GZ archive of all partitions
            - SHA256 checksums
            
            ### Device Info
            - Model: Infinix Hot 10i (X659B)
            - Chipset: MediaTek MT6768 (Helio P65)
            - Android: 11 (Go Edition)
            
            ⚠️ **Warning:** Use at your own risk. Verify compatibility before flashing.
          files: |
            infinix_x659b_firmware_dump.zip
            infinix_x659b_firmware_dump.tar.gz
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          docker system prune -f
          rm -rf firmware extracted_firmware
