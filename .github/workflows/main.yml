name: Build mt6768 Mainline Kernel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:      # Manual trigger bhi allow karta hai

jobs:
  build-kernel:
    runs-on: ubuntu-22.04   # Latest stable Ubuntu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1      # Sirf latest commit chahiye

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git make gcc-aarch64-linux-gnu \
            libssl-dev flex bison bc \
            python3 python3-pip \
            device-tree-compiler \
            cpio rsync

      - name: Set up cross-compilation environment
        run: |
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV

      - name: Clean previous builds (optional)
        run: make mrproper

      - name: Configure kernel (mt6768_defconfig)
        run: make mt6768_defconfig

      - name: Build kernel image and device trees
        run: |
          make -j$(nproc) Image.gz
          make -j$(nproc) dtbs

      - name: Upload kernel image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image.gz
          path: arch/arm64/boot/Image.gz

      - name: Upload device tree blobs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dtbs
          path: arch/arm64/boot/dts/mediatek/
