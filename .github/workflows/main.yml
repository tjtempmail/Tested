name: Download Windows ISO with aria2

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      max_concurrent_downloads:
        description: 'Maximum number of concurrent downloads'
        required: false
        default: '4'
        type: string
      max_connection_per_server:
        description: 'Maximum connections per server'
        required: false
        default: '8'
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Create download directory
        run: mkdir -p downloads

      - name: Download ISO with aria2
        working-directory: downloads
        run: |
          aria2c \
            --max-concurrent-downloads=${{ github.event.inputs.max_concurrent_downloads || '4' }} \
            --max-connection-per-server=${{ github.event.inputs.max_connection_per_server || '8' }} \
            --min-split-size=1M \
            --split=16 \
            --continue=true \
            --retry-wait=5 \
            --max-tries=0 \
            --timeout=60 \
            --console-log-level=warn \
            --summary-interval=30 \
            --disk-cache=64M \
            --file-allocation=falloc \
            --remote-time=true \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.0" \
            "https://drive.massgrave.dev/en-us_windows_10_iot_enterprise_ltsc_2021_x64_dvd_257ad90f.iso"

      - name: Verify download
        working-directory: downloads
        run: |
          ls -lh *.iso
          sha256sum *.iso || true

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-10-iot-ltsc-2021
          path: downloads/*.iso
          retention-days: 1  # Adjust as needed
          
