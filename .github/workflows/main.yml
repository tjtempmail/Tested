name: Generate Infinix X659B Device Tree

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Direct URL to firmware ZIP'
        required: false
        default: 'https://archive.org/download/infinix-hot-10i-x-659-b-04/Infinix-Hot-10i-X659B-04.zip'
      device_codename:
        description: 'Device codename'
        required: false
        default: 'x659b'
      device_manufacturer:
        description: 'Device manufacturer'
        required: false
        default: 'infinix'

env:
  PYTHON_VERSION: '3.11'
  FIRMWARE_URL: ${{ github.event.inputs.firmware_url || 'https://archive.org/download/infinix-hot-10i-x-659-b-04/Infinix-Hot-10i-X659B-04.zip' }}
  DEVICE_CODENAME: ${{ github.event.inputs.device_codename || 'x659b' }}
  DEVICE_MANUFACTURER: ${{ github.event.inputs.device_manufacturer || 'infinix' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo add-apt-repository universe -y
          sudo apt-get update
          sudo apt-get install -y \
            unace unrar zip unzip p7zip-full p7zip-rar \
            sharutils rar uudeview mpack arj cabextract \
            rename liblzma-dev brotli lz4 protobuf-compiler \
            git gawk cpio aria2 curl wget \
            libmagic1 libxml2-utils \
            device-tree-compiler \
            android-sdk-libsparse-utils \
            libbz2-dev libreadline-dev libsqlite3-dev \
            libncursesw5-dev xz-utils tk-dev libxml2-dev \
            libxmlsec1-dev libffi-dev liblzma-dev \
            python3-dev gcc g++ make \
            erofs-utils

      - name: Verify erofs-utils installation
        run: |
          which fsck.erofs || echo "fsck.erofs not found"
          which dump.erofs || echo "dump.erofs not found"
          
          if ! command -v fsck.erofs &> /dev/null; then
            echo "Downloading prebuilt erofs-utils..."
            cd /tmp
            curl -L -o erofs-utils.tar.gz "https://github.com/sekaiacg/erofs-utils/releases/download/v1.8.10-251217/erofs-utils-v1.8.10-251217-linux-x86_64.tar.gz"
            tar -xzf erofs-utils.tar.gz
            sudo cp erofs-utils/fsck.erofs /usr/local/bin/
            sudo cp erofs-utils/dump.erofs /usr/local/bin/
            sudo chmod +x /usr/local/bin/*.erofs
          fi

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install dumpyara aospdtgen
          pip install backports.lzma protobuf pycryptodome extract-dtb

      - name: Create working directories
        run: |
          mkdir -p ~/dumpyara
          mkdir -p ~/dumpyara/deviceTree
          mkdir -p ~/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}
          echo "WORK_DIR=$HOME/dumpyara" >> $GITHUB_ENV
          echo "DEVICE_DIR=$HOME/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}" >> $GITHUB_ENV

      - name: Download firmware
        run: |
          cd ~/dumpyara
          echo "Downloading firmware from ${{ env.FIRMWARE_URL }}..."
          
          aria2c -x 16 -s 16 -k 1M -o firmware.zip "${{ env.FIRMWARE_URL }}" || \
          wget --progress=bar:force -O firmware.zip "${{ env.FIRMWARE_URL }}" || \
          curl -L -o firmware.zip "${{ env.FIRMWARE_URL }}"
          
          if [ ! -f firmware.zip ]; then
            echo "Error: Failed to download firmware"
            exit 1
          fi
          
          ls -lh firmware.zip
          file firmware.zip

      - name: Extract firmware with dumpyara
        run: |
          cd ~/dumpyara
          echo "Extracting firmware with dumpyara..."
          
          python3 -m dumpyara firmware.zip
          
          # Find the working directory created by dumpyara
          DUMP_DIR=$(find ~/dumpyara -maxdepth 2 -type d -name "*Infinix*" -o -name "*X659B*" -o -name "*working*" | head -1)
          
          if [ -z "$DUMP_DIR" ]; then
            ls -la ~/dumpyara/
            DUMP_DIR=$(find ~/dumpyara -maxdepth 3 -type d | grep -v "^/home/runner/dumpyara$" | head -2 | tail -1)
          fi
          
          echo "Found dump directory: $DUMP_DIR"
          echo "DUMP_DIR=$DUMP_DIR" >> $GITHUB_ENV
          
          ls -la "$DUMP_DIR" || true

      - name: Generate device tree with aospdtgen
        run: |
          cd ~/dumpyara
          echo "Generating device tree with aospdtgen..."
          
          if [ -z "$DUMP_DIR" ] || [ ! -d "$DUMP_DIR" ]; then
            echo "Error: Dump directory not found"
            exit 1
          fi
          
          # Run aospdtgen (generates extract-files.sh by default)
          python3 -m aospdtgen "$DUMP_DIR" -o ~/dumpyara/deviceTree
          
          # Find generated device tree
          DT_DIR=$(find ~/dumpyara/deviceTree -maxdepth 3 -type d -name "${{ env.DEVICE_CODENAME }}" | head -1)
          
          if [ -z "$DT_DIR" ]; then
            DT_DIR=$(find ~/dumpyara/deviceTree -maxdepth 4 -type d | grep -E "(device|${{ env.DEVICE_CODENAME }})" | head -1)
          fi
          
          echo "Device tree location: $DT_DIR"
          echo "DT_DIR=$DT_DIR" >> $GITHUB_ENV
          
          if [ -d "$DT_DIR" ]; then
            ls -laR "$DT_DIR"
          fi

      - name: Prepare device tree structure
        run: |
          echo "Preparing device tree for LineageOS..."
          
          mkdir -p ~/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}
          
          if [ -d "$DT_DIR" ]; then
            cp -r "$DT_DIR"/* ~/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}/ || true
            
            # Check what files were generated
            echo "Generated files in device tree:"
            ls -la ~/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}/
          fi

      - name: Run extract-files script
        run: |
          DEVICE_PATH=~/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}
          
          echo "Checking for extract scripts in $DEVICE_PATH..."
          ls -la "$DEVICE_PATH/" || true
          
          # CRITICAL FIX: Check for BOTH .sh and .py versions
          if [ -f "$DEVICE_PATH/extract-files.sh" ]; then
            echo "Found extract-files.sh (aospdtgen default for LineageOS 21 and below)"
            chmod +x "$DEVICE_PATH/extract-files.sh"
            
            # Create vendor directory structure
            mkdir -p ~/android/lineage/vendor/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}
            
            cd "$DEVICE_PATH"
            ./extract-files.sh "$DUMP_DIR" || echo "Extract files completed with warnings"
            
          elif [ -f "$DEVICE_PATH/extract-files.py" ]; then
            echo "Found extract-files.py (LineageOS 22+ style)"
            chmod +x "$DEVICE_PATH/extract-files.py"
            
            mkdir -p ~/android/lineage/vendor/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}
            
            cd "$DEVICE_PATH"
            python3 extract-files.py "$DUMP_DIR" || echo "Extract files completed with warnings"
          else
            echo "WARNING: No extract-files script found!"
            echo "Files in device tree:"
            find "$DEVICE_PATH" -type f | head -20
          fi

      - name: Package outputs
        run: |
          echo "Packaging generated device tree and vendor files..."
          
          cd ~/android/lineage
          tar -czf ~/device-tree-${{ env.DEVICE_CODENAME }}.tar.gz device/ vendor/ || \
          tar -czf ~/device-tree-${{ env.DEVICE_CODENAME }}.tar.gz device/ || \
          tar -czf ~/device-tree-${{ env.DEVICE_CODENAME }}.tar.gz -C ~/dumpyara deviceTree/
          
          cd ~/dumpyara
          tar -czf ~/firmware-dump-${{ env.DEVICE_CODENAME }}.tar.gz working/ --exclude="firmware.zip" || true
          
          ls -lh ~/*.tar.gz

      - name: Upload device tree artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-tree-${{ env.DEVICE_CODENAME }}
          path: ~/device-tree-${{ env.DEVICE_CODENAME }}.tar.gz
          retention-days: 30

      - name: Upload firmware dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-dump-${{ env.DEVICE_CODENAME }}
          path: ~/firmware-dump-${{ env.DEVICE_CODENAME }}.tar.gz
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        run: |
          echo "=========================================="
          echo "Device Tree Generation Complete"
          echo "=========================================="
          echo "Device: ${{ env.DEVICE_MANUFACTURER }} ${{ env.DEVICE_CODENAME }}"
          echo ""
          echo "Generated files should include:"
          echo "- extract-files.sh (shell script for LineageOS 21 and below)"
          echo "- setup-makefiles.sh"
          echo "- proprietary-files.txt"
          echo "- BoardConfig.mk"
          echo "- device.mk"
          echo "- Android.mk"
          echo ""
          echo "NOTE: aospdtgen generates SHELL scripts (.sh), not Python (.py)"
          echo "For LineageOS 22+, you need to manually convert to Python templates"
          echo "=========================================="
          
