name: Generate Infinix X659B Device Tree

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Direct URL to firmware ZIP'
        required: false
        default: 'https://archive.org/download/infinix-hot-10i-x-659-b-04/Infinix-Hot-10i-X659B-04.zip'
      device_codename:
        description: 'Device codename (use firmware codename if different)'
        required: false
        default: 'x659b'
      device_manufacturer:
        description: 'Device manufacturer'
        required: false
        default: 'infinix'

env:
  PYTHON_VERSION: '3.11'
  FIRMWARE_URL: ${{ github.event.inputs.firmware_url || 'https://archive.org/download/infinix-hot-10i-x-659-b-04/Infinix-Hot-10i-X659B-04.zip' }}
  DEVICE_CODENAME: ${{ github.event.inputs.device_codename || 'x659b' }}
  DEVICE_MANUFACTURER: ${{ github.event.inputs.device_manufacturer || 'infinix' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo add-apt-repository universe -y
          sudo apt-get update
          sudo apt-get install -y \
            unace unrar zip unzip p7zip-full p7zip-rar \
            sharutils rar uudeview mpack arj cabextract \
            rename liblzma-dev brotli lz4 protobuf-compiler \
            git gawk cpio aria2 curl wget \
            libmagic1 libxml2-utils \
            device-tree-compiler \
            android-sdk-libsparse-utils \
            libbz2-dev libreadline-dev libsqlite3-dev \
            libncursesw5-dev xz-utils tk-dev libxml2-dev \
            libxmlsec1-dev libffi-dev liblzma-dev \
            python3-dev gcc g++ make \
            erofs-utils sed

      - name: Verify erofs-utils installation
        run: |
          which fsck.erofs || echo "fsck.erofs not found"
          which dump.erofs || echo "dump.erofs not found"
          
          if ! command -v fsck.erofs &> /dev/null; then
            echo "Downloading prebuilt erofs-utils..."
            cd /tmp
            curl -L -o erofs-utils.tar.gz "https://github.com/sekaiacg/erofs-utils/releases/download/v1.8.10-251217/erofs-utils-v1.8.10-251217-linux-x86_64.tar.gz"
            tar -xzf erofs-utils.tar.gz
            sudo cp erofs-utils/fsck.erofs /usr/local/bin/
            sudo cp erofs-utils/dump.erofs /usr/local/bin/
            sudo chmod +x /usr/local/bin/*.erofs
          fi

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install dumpyara aospdtgen
          pip install backports.lzma protobuf pycryptodome extract-dtb

      - name: Clone LineageOS extract-utils to correct location
        run: |
          echo "Creating LineageOS directory structure..."
          mkdir -p $HOME/android/lineage/tools
          
          echo "Cloning extract-utils to correct location..."
          cd $HOME/android/lineage/tools
          git clone --depth=1 https://github.com/LineageOS/android_tools_extract-utils.git extract-utils
          
          echo "Extract-utils cloned to:"
          pwd
          ls -la extract-utils/

      - name: Create working directories
        run: |
          mkdir -p $HOME/dumpyara
          mkdir -p $HOME/dumpyara/deviceTree
          mkdir -p $HOME/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}
          echo "WORK_DIR=$HOME/dumpyara" >> $GITHUB_ENV
          echo "DEVICE_DIR=$HOME/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}" >> $GITHUB_ENV

      - name: Download firmware
        run: |
          cd $HOME/dumpyara
          echo "Downloading firmware from ${{ env.FIRMWARE_URL }}..."
          
          aria2c -x 16 -s 16 -k 1M -o firmware.zip "${{ env.FIRMWARE_URL }}" || \
          wget --progress=bar:force -O firmware.zip "${{ env.FIRMWARE_URL }}" || \
          curl -L -o firmware.zip "${{ env.FIRMWARE_URL }}"
          
          if [ ! -f firmware.zip ]; then
            echo "Error: Failed to download firmware"
            exit 1
          fi
          
          ls -lh firmware.zip
          file firmware.zip

      - name: Extract firmware with dumpyara
        run: |
          cd $HOME/dumpyara
          echo "Extracting firmware with dumpyara..."
          
          python3 -m dumpyara firmware.zip
          
          if [ -d "$HOME/dumpyara/firmware" ]; then
            DUMP_DIR="$HOME/dumpyara/firmware"
            echo "Found firmware directory at $DUMP_DIR"
          else
            echo "ERROR: Could not find $HOME/dumpyara/firmware"
            ls -la $HOME/dumpyara/
            exit 1
          fi
          
          echo "Firmware directory contents:"
          ls -la "$DUMP_DIR"
          
          echo "DUMP_DIR=$DUMP_DIR" >> $GITHUB_ENV

      - name: Generate device tree with aospdtgen
        run: |
          echo "Generating device tree with aospdtgen..."
          echo "Using dump directory: $DUMP_DIR"
          
          if [ -z "$DUMP_DIR" ] || [ ! -d "$DUMP_DIR" ]; then
            echo "Error: Dump directory not found"
            exit 1
          fi
          
          cd $HOME/dumpyara
          python3 -m aospdtgen "$DUMP_DIR" -o $HOME/dumpyara/deviceTree
          
          # Find the generated device tree - aospdtgen uses firmware codename (e.g., FULL-64)
          DT_DIR=$(find $HOME/dumpyara/deviceTree -maxdepth 1 -type d | grep -v "^$HOME/dumpyara/deviceTree$" | head -1)
          
          if [ -z "$DT_DIR" ] || [ ! -d "$DT_DIR" ]; then
            DT_DIR="$HOME/dumpyara/deviceTree"
          fi
          
          # Get the actual codename from the directory name
          GENERATED_CODENAME=$(basename "$DT_DIR")
          echo "Generated device tree codename: $GENERATED_CODENAME"
          echo "User requested codename: ${{ env.DEVICE_CODENAME }}"
          
          # If different, we need to handle this
          if [ "$GENERATED_CODENAME" != "${{ env.DEVICE_CODENAME }}" ]; then
            echo "WARNING: Firmware codename ($GENERATED_CODENAME) differs from requested codename (${{ env.DEVICE_CODENAME }})"
            echo "Will use firmware codename for device tree to ensure extract-files.py works"
            echo "GENERATED_CODENAME=$GENERATED_CODENAME" >> $GITHUB_ENV
          else
            echo "GENERATED_CODENAME=${{ env.DEVICE_CODENAME }}" >> $GITHUB_ENV
          fi
          
          echo "Device tree location: $DT_DIR"
          echo "DT_DIR=$DT_DIR" >> $GITHUB_ENV
          
          if [ -d "$DT_DIR" ]; then
            echo "Device tree contents:"
            ls -laR "$DT_DIR" || true
          fi

      - name: Prepare device tree structure
        run: |
          echo "Preparing device tree for LineageOS..."
          
          # Use the generated codename (from firmware) for the directory structure
          # This ensures extract-files.py can find the files it expects
          ACTUAL_CODENAME="${GENERATED_CODENAME:-${{ env.DEVICE_CODENAME }}}"
          echo "Using codename: $ACTUAL_CODENAME"
          
          mkdir -p $HOME/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/$ACTUAL_CODENAME
          
          if [ -d "$DT_DIR" ]; then
            cp -r "$DT_DIR"/* $HOME/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/$ACTUAL_CODENAME/ 2>/dev/null || true
            
            echo "Files copied to device tree:"
            ls -la $HOME/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/$ACTUAL_CODENAME/ || true
            
            # Save the actual codename for later steps
            echo "ACTUAL_CODENAME=$ACTUAL_CODENAME" >> $GITHUB_ENV
          fi

      - name: Run extract-files script
        run: |
          ACTUAL_CODENAME="${ACTUAL_CODENAME:-${{ env.DEVICE_CODENAME }}}"
          DEVICE_PATH=$HOME/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/$ACTUAL_CODENAME
          
          echo "Checking for extract scripts in $DEVICE_PATH..."
          ls -la "$DEVICE_PATH/" 2>/dev/null || true
          
          # Create vendor directory structure
          mkdir -p $HOME/android/lineage/vendor/${{ env.DEVICE_MANUFACTURER }}/$ACTUAL_CODENAME
          
          if [ -f "$DEVICE_PATH/extract-files.sh" ]; then
            echo "Found extract-files.sh (LineageOS 21 and below style)"
            chmod +x "$DEVICE_PATH/extract-files.sh"
            
            cd "$DEVICE_PATH"
            ./extract-files.sh "$DUMP_DIR" || echo "Extract files completed with warnings"
            
          elif [ -f "$DEVICE_PATH/extract-files.py" ]; then
            echo "Found extract-files.py (LineageOS 22+ style)"
            chmod +x "$DEVICE_PATH/extract-files.py"
            
            cd "$DEVICE_PATH"
            
            echo "Running extract-files.py with built-in PYTHONPATH from shebang..."
            ./extract-files.py "$DUMP_DIR" || {
              echo "extract-files.py failed, trying with explicit PYTHONPATH..."
              PYTHONPATH=$HOME/android/lineage/tools/extract-utils:$PYTHONPATH python3 extract-files.py "$DUMP_DIR" || \
              echo "Extract files completed with warnings"
            }
          else
            echo "No extract-files script found"
          fi

      - name: Rename device tree to requested codename (optional)
        run: |
          ACTUAL_CODENAME="${ACTUAL_CODENAME:-${{ env.DEVICE_CODENAME }}}"
          
          # If the actual codename differs from requested, create a renamed copy
          if [ "$ACTUAL_CODENAME" != "${{ env.DEVICE_CODENAME }}" ]; then
            echo "Creating renamed copy from $ACTUAL_CODENAME to ${{ env.DEVICE_CODENAME }}..."
            
            cp -r $HOME/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/$ACTUAL_CODENAME \
                  $HOME/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}_renamed
            
            # Update all references in the renamed copy
            cd $HOME/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}_renamed
            
            # Replace codename in files
            find . -type f \( -name "*.py" -o -name "*.mk" -o -name "*.bp" -o -name "*.txt" \) -exec \
              sed -i "s/$ACTUAL_CODENAME/${{ env.DEVICE_CODENAME }}/g" {} \; 2>/dev/null || true
            
            # Rename the renamed directory to final name
            mv $HOME/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}_renamed \
               $HOME/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}
            
            echo "Renamed device tree created at:"
            ls -la $HOME/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}/
          fi

      - name: Package outputs
        run: |
          echo "Packaging outputs..."
          
          cd $HOME/android/lineage
          tar -czf ${{ github.workspace }}/device-tree-${{ env.DEVICE_CODENAME }}.tar.gz device/ vendor/ 2>/dev/null || \
          tar -czf ${{ github.workspace }}/device-tree-${{ env.DEVICE_CODENAME }}.tar.gz device/ 2>/dev/null || \
          tar -czf ${{ github.workspace }}/device-tree-${{ env.DEVICE_CODENAME }}.tar.gz -C $HOME/dumpyara deviceTree/
          
          cd $HOME/dumpyara
          tar -czf ${{ github.workspace }}/firmware-dump-${{ env.DEVICE_CODENAME }}.tar.gz firmware/ --exclude="firmware.zip" 2>/dev/null || true
          
          ls -lh ${{ github.workspace }}/*.tar.gz 2>/dev/null || echo "Archives created"

      - name: Upload device tree artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-tree-${{ env.DEVICE_CODENAME }}
          path: ${{ github.workspace }}/device-tree-${{ env.DEVICE_CODENAME }}.tar.gz
          retention-days: 30
          if-no-files-found: warn

      - name: Upload firmware dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-dump-${{ env.DEVICE_CODENAME }}
          path: ${{ github.workspace }}/firmware-dump-${{ env.DEVICE_CODENAME }}.tar.gz
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        run: |
          ACTUAL_CODENAME="${ACTUAL_CODENAME:-${{ env.DEVICE_CODENAME }}}"
          
          echo "=========================================="
          echo "Device Tree Generation Complete"
          echo "=========================================="
          echo "Firmware codename: $ACTUAL_CODENAME"
          echo "Requested codename: ${{ env.DEVICE_CODENAME }}"
          echo "Dump directory: $DUMP_DIR"
          echo ""
          echo "Generated device tree files:"
          ls -la $HOME/android/lineage/device/${{ env.DEVICE_MANUFACTURER }}/$ACTUAL_CODENAME/ || true
          echo ""
          echo "Vendor files (if extracted):"
          ls -la $HOME/android/lineage/vendor/${{ env.DEVICE_MANUFACTURER }}/$ACTUAL_CODENAME/ 2>/dev/null || echo "No vendor files extracted"
          echo ""
          if [ "$ACTUAL_CODENAME" != "${{ env.DEVICE_CODENAME }}" ]; then
            echo "NOTE: Device tree was generated with firmware codename ($ACTUAL_CODENAME)"
            echo "      A renamed copy with requested codename (${{ env.DEVICE_CODENAME }}) was also created"
          fi
          echo "=========================================="
          
