name: Extract Info from boot.img (Android 11 Fixed)

on:
  workflow_dispatch:
    inputs:
      bootimg_url:
        description: 'Direct URL to stock boot.img (e.g., from Google Drive)'
        required: true
        type: string

jobs:
  extract-info:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout dummy repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            wget curl \
            device-tree-compiler \
            cpio \
            binutils \
            file \
            xz-utils \
            lz4

      - name: Download magiskboot binary
        run: |
          # Direct download of magiskboot Linux executable from official release
          wget -O magiskboot https://github.com/topjohnwu/Magisk/releases/download/v28.1/magiskboot
          chmod +x magiskboot
          echo "$(pwd)" >> $GITHUB_PATH

      - name: Download boot.img from provided URL
        run: |
          wget -O stock-boot.img "${{ inputs.bootimg_url }}"
          echo "Downloaded file size: $(du -h stock-boot.img | cut -f1)"
          file stock-boot.img

      - name: Create output directory
        run: mkdir -p output

      - name: Unpack boot.img with magiskboot
        run: |
          ./magiskboot unpack stock-boot.img
          echo "Files extracted by magiskboot:"
          ls -la
          # Copy extracted files to output
          cp kernel output/ 2>/dev/null || true
          cp ramdisk.cpio output/ 2>/dev/null || true
          cp dtb output/ 2>/dev/null || true
          cp header output/ 2>/dev/null || true
          cp kernel_dtb output/ 2>/dev/null || true

      - name: Extract kernel command line from header
        run: |
          if [ -f header ]; then
            grep -a "cmdline=" header | cut -d= -f2- > output/cmdline.txt
            echo "Kernel command line:"
            cat output/cmdline.txt
          else
            echo "No header file" > output/cmdline.txt
          fi

      - name: Extract kernel version from kernel image
        run: |
          if [ -f kernel ]; then
            strings kernel | grep -E '^Linux version [0-9]' | head -1 > output/kernel_version.txt
            if [ -s output/kernel_version.txt ]; then
              echo "Kernel version:"
              cat output/kernel_version.txt
            else
              echo "Could not extract kernel version" > output/kernel_version.txt
            fi
          else
            echo "No kernel file" > output/kernel_version.txt
          fi

      - name: Convert DTB to DTS (if found)
        run: |
          if [ -f dtb ]; then
            echo "dtb file found. Size: $(du -h dtb | cut -f1)"
            file dtb > output/dtb_filetype.txt
            cat output/dtb_filetype.txt
            
            # Try dtc conversion
            dtc -I dtb -O dts -o output/stock.dts dtb 2> output/dtc_errors.txt || {
              echo "dtc conversion failed. Trying fdtdump..." >> output/dtc_errors.txt
              fdtdump dtb > output/fdtdump.txt 2>&1
            }
            
            # Also copy original dtb
            cp dtb output/original.dtb
          elif [ -f kernel_dtb ]; then
            echo "Using kernel_dtb instead of dtb" > output/dtb_filetype.txt
            file kernel_dtb >> output/dtb_filetype.txt
            dtc -I dtb -O dts -o output/stock.dts kernel_dtb 2> output/dtc_errors.txt || {
              fdtdump kernel_dtb > output/fdtdump.txt 2>&1
            }
            cp kernel_dtb output/original.dtb
          else
            echo "No dtb or kernel_dtb file extracted." > output/dtb_filetype.txt
          fi

      - name: Extract ramdisk contents
        run: |
          if [ -f ramdisk.cpio ]; then
            mkdir -p ramdisk_root
            cd ramdisk_root
            # Try to decompress if it's gzipped
            if file ../ramdisk.cpio | grep -q gzip; then
              gunzip -c ../ramdisk.cpio | cpio -i -d -m --quiet 2>/dev/null || echo "cpio extraction failed"
            else
              cpio -i -d -m --quiet < ../ramdisk.cpio 2>/dev/null || echo "cpio extraction failed"
            fi
            cd ..
            echo "Ramdisk contents (top-level):" > output/ramdisk_list.txt
            ls -la ramdisk_root/ >> output/ramdisk_list.txt 2>/dev/null
            # Check for init, default.prop, etc.
            [ -f ramdisk_root/init ] && echo "init found" >> output/ramdisk_list.txt
            [ -f ramdisk_root/default.prop ] && head -5 ramdisk_root/default.prop >> output/ramdisk_list.txt
            # Archive ramdisk for download
            tar -czf output/ramdisk_extracted.tar.gz -C ramdisk_root . 2>/dev/null || true
          else
            echo "No ramdisk.cpio found" > output/ramdisk_list.txt
          fi

      - name: Generate summary info
        run: |
          {
            echo "BOOT.IMG INFO SUMMARY"
            echo "====================="
            echo "File size: $(du -h stock-boot.img | cut -f1)"
            echo ""
            echo "--- Kernel ---"
            cat output/kernel_version.txt
            echo ""
            echo "--- Command Line ---"
            cat output/cmdline.txt
            echo ""
            echo "--- Device Tree Info ---"
            if [ -f output/dtb_filetype.txt ]; then
              cat output/dtb_filetype.txt
            fi
            if [ -f output/stock.dts ]; then
              echo "DTS successfully generated. First 20 lines:"
              head -20 output/stock.dts
            elif [ -f output/fdtdump.txt ]; then
              echo "FDT Dump (first 30 lines):"
              head -30 output/fdtdump.txt
            else
              echo "No device tree information available."
            fi
            echo ""
            echo "--- Ramdisk Top Files ---"
            cat output/ramdisk_list.txt
          } > output/INFO.txt

      - name: Upload all extracted info as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootimg-info-android11
          path: |
            output/
            kernel
            ramdisk.cpio
            dtb
            kernel_dtb
            header
          if-no-files-found: ignore
