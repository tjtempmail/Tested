name: Build Kernel Only for Infinix X659B

on:
  workflow_dispatch:

jobs:
  build-kernel-only:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git gcc-aarch64-linux-gnu libssl-dev flex bison bc

      - name: Clone kernel source
        run: git clone --depth 1 https://github.com/mt6768-mainline/linux.git

      - name: Configure kernel
        run: |
          cd linux
          make ARCH=arm64 mt6768_defconfig

      - name: Build kernel image
        run: |
          cd linux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image.gz

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: x659b-kernel-Image.gz
          path: linux/arch/arm64/boot/Image.gz
