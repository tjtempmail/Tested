name: Extract Info from boot.img (Android 11 - Final)

on:
  workflow_dispatch:
    inputs:
      bootimg_url:
        description: 'Direct URL to stock boot.img (e.g., from Google Drive)'
        required: true
        type: string

jobs:
  extract-info:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout dummy repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            wget curl \
            device-tree-compiler \
            cpio \
            binutils \
            file \
            lz4 \
            xz-utils

      - name: Clone and build mkbootimg (for unpackbootimg)
        run: |
          git clone https://github.com/osm0sis/mkbootimg.git
          cd mkbootimg
          make
          echo "$(pwd)" >> $GITHUB_PATH

      - name: Download boot.img from provided URL
        run: |
          wget -O stock-boot.img "${{ inputs.bootimg_url }}"
          echo "Downloaded file size: $(du -h stock-boot.img | cut -f1)"
          file stock-boot.img

      - name: Create output directory
        run: mkdir -p output

      - name: Unpack boot.img with unpackbootimg
        run: |
          mkdir -p boot_unpacked
          unpackbootimg -i stock-boot.img -o boot_unpacked/
          ls -la boot_unpacked/
          cp boot_unpacked/* output/ 2>/dev/null || true

      - name: Extract kernel command line
        run: |
          if [ -f boot_unpacked/stock-boot.img-cmdline ]; then
            cat boot_unpacked/stock-boot.img-cmdline > output/cmdline.txt
            echo "Kernel command line:"
            cat output/cmdline.txt
          else
            echo "No cmdline file found" > output/cmdline.txt
          fi

      - name: Extract base address and pagesize
        run: |
          if [ -f boot_unpacked/stock-boot.img-base ]; then
            cp boot_unpacked/stock-boot.img-base output/base.txt
            echo "Base address: $(cat output/base.txt)"
          fi
          if [ -f boot_unpacked/stock-boot.img-pagesize ]; then
            cp boot_unpacked/stock-boot.img-pagesize output/pagesize.txt
            echo "Pagesize: $(cat output/pagesize.txt)"
          fi

      - name: Extract kernel version from kernel image
        run: |
          if [ -f boot_unpacked/stock-boot.img-kernel ]; then
            cp boot_unpacked/stock-boot.img-kernel output/kernel
            strings boot_unpacked/stock-boot.img-kernel | grep -E '^Linux version [0-9]' | head -1 > output/kernel_version.txt
            if [ -s output/kernel_version.txt ]; then
              echo "Kernel version:"
              cat output/kernel_version.txt
            else
              echo "Could not extract kernel version" > output/kernel_version.txt
            fi
          else
            echo "No kernel file" > output/kernel_version.txt
          fi

      - name: Analyze DTB file (try multiple methods)
        run: |
          if [ -f boot_unpacked/stock-boot.img-dtb ]; then
            cp boot_unpacked/stock-boot.img-dtb output/original.dtb
            echo "DTB file size: $(du -h output/original.dtb | cut -f1)" > output/dtb_analysis.txt
            file output/original.dtb >> output/dtb_analysis.txt
            
            # Method 1: Try dtc conversion
            echo "=== dtc conversion attempt ===" >> output/dtb_analysis.txt
            dtc -I dtb -O dts -o output/stock.dts output/original.dtb 2>> output/dtb_analysis.txt || echo "dtc failed" >> output/dtb_analysis.txt
            
            # Method 2: Try fdtdump
            echo "=== fdtdump output (first 50 lines) ===" >> output/dtb_analysis.txt
            fdtdump output/original.dtb 2>/dev/null | head -50 >> output/dtb_analysis.txt
            
            # Method 3: Extract strings from DTB (often contains model/compatible)
            echo "=== strings from DTB ===" >> output/dtb_analysis.txt
            strings -n 8 output/original.dtb | grep -E "model|compatible|mediatek|infinix" | head -20 >> output/dtb_analysis.txt
            
            # Method 4: Hexdump first 256 bytes
            echo "=== hexdump first 256 bytes ===" >> output/dtb_analysis.txt
            hexdump -C -n 256 output/original.dtb >> output/dtb_analysis.txt
          else
            echo "No DTB file found" > output/dtb_analysis.txt
          fi

      - name: Extract ramdisk contents
        run: |
          if [ -f boot_unpacked/stock-boot.img-ramdisk ]; then
            cp boot_unpacked/stock-boot.img-ramdisk output/ramdisk.cpio.gz
            mkdir -p ramdisk_root
            cd ramdisk_root
            # Try to decompress if it's gzipped
            if file ../output/ramdisk.cpio.gz | grep -q gzip; then
              gunzip -c ../output/ramdisk.cpio.gz | cpio -i -d -m --quiet 2>/dev/null || echo "cpio extraction failed" > ../output/ramdisk_error.txt
            else
              cpio -i -d -m --quiet < ../output/ramdisk.cpio.gz 2>/dev/null || echo "cpio extraction failed" > ../output/ramdisk_error.txt
            fi
            cd ..
            echo "Ramdisk contents (top-level):" > output/ramdisk_list.txt
            ls -la ramdisk_root/ >> output/ramdisk_list.txt 2>/dev/null
            # Check for init, default.prop, etc.
            [ -f ramdisk_root/init ] && echo "init found" >> output/ramdisk_list.txt
            [ -f ramdisk_root/default.prop ] && head -5 ramdisk_root/default.prop >> output/ramdisk_list.txt
            # Archive ramdisk for download
            tar -czf output/ramdisk_extracted.tar.gz -C ramdisk_root . 2>/dev/null || true
          else
            echo "No ramdisk found" > output/ramdisk_list.txt
          fi

      - name: Generate summary info
        run: |
          {
            echo "BOOT.IMG INFO SUMMARY"
            echo "====================="
            echo "File size: $(du -h stock-boot.img | cut -f1)"
            echo ""
            echo "--- Kernel ---"
            cat output/kernel_version.txt
            echo ""
            echo "--- Command Line ---"
            cat output/cmdline.txt
            echo ""
            echo "--- Base Address ---"
            cat output/base.txt
            echo "--- Pagesize ---"
            cat output/pagesize.txt
            echo ""
            echo "--- Device Tree Analysis ---"
            cat output/dtb_analysis.txt
            echo ""
            echo "--- Ramdisk Top Files ---"
            cat output/ramdisk_list.txt
          } > output/INFO.txt

      - name: Upload all extracted info as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootimg-info-android11-final
          path: |
            output/
            boot_unpacked/
