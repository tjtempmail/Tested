name: Build for Infinix X659B

on:
  workflow_dispatch:

jobs:
  build-x659b:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git gcc-aarch64-linux-gnu libssl-dev flex bison bc device-tree-compiler

      - name: Clone kernel source
        run: git clone --depth 1 https://github.com/mt6768-mainline/linux.git

      - name: Configure
        run: |
          cd linux
          make ARCH=arm64 mt6768_defconfig

      - name: Build kernel
        run: |
          cd linux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image.gz
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) dtbs

      - name: Create boot.img structure
        run: |
          mkdir -p boot_artifacts
          cp linux/arch/arm64/boot/Image.gz boot_artifacts/
          cp linux/arch/arm64/boot/dts/mediatek/mt6768*.dtb boot_artifacts/

      - name: Upload all files
        uses: actions/upload-artifact@v4
        with:
          name: x659b-kernel-files
          path: boot_artifacts/
