name: Generate Infinix X659B Device Tree

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Direct URL to firmware ZIP'
        required: false
        default: 'https://archive.org/download/infinix-hot-10i-x-659-b-04/Infinix-Hot-10i-X659B-04.zip'

env:
  PYTHON_VERSION: '3.11'
  FIRMWARE_URL: ${{ github.event.inputs.firmware_url || 'https://archive.org/download/infinix-hot-10i-x-659-b-04/Infinix-Hot-10i-X659B-04.zip' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo add-apt-repository universe -y
          sudo apt-get update
          sudo apt-get install -y \
            unace unrar zip unzip p7zip-full p7zip-rar \
            sharutils rar uudeview mpack arj cabextract \
            rename liblzma-dev brotli lz4 protobuf-compiler \
            git gawk cpio aria2 curl wget \
            libmagic1 libxml2-utils \
            device-tree-compiler \
            android-sdk-libsparse-utils \
            libbz2-dev libreadline-dev libsqlite3-dev \
            libncursesw5-dev xz-utils tk-dev libxml2-dev \
            libxmlsec1-dev libffi-dev liblzma-dev \
            python3-dev gcc g++ make \
            erofs-utils

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install dumpyara aospdtgen
          pip install backports.lzma protobuf pycryptodome extract-dtb

      - name: Create LineageOS directory structure and clone extract-utils
        run: |
          # Create the EXACT directory structure that extract-files.py expects
          # Shebang: PYTHONPATH=../../../tools/extract-utils
          # Device tree will be at: ~/android/lineage/device/infinix/<codename>/
          # So extract-utils must be at: ~/android/lineage/tools/extract-utils
          
          mkdir -p $HOME/android/lineage/tools
          cd $HOME/android/lineage/tools
          
          echo "Cloning LineageOS extract-utils..."
          git clone --depth=1 https://github.com/LineageOS/android_tools_extract-utils.git extract-utils
          
          echo "Verifying extract-utils structure:"
          ls -la extract-utils/
          ls -la extract-utils/extract_utils/ 2>/dev/null || echo "extract_utils directory not found"

      - name: Download firmware
        run: |
          mkdir -p $HOME/dumpyara
          cd $HOME/dumpyara
          
          echo "Downloading firmware..."
          aria2c -x 16 -s 16 -k 1M -o firmware.zip "${{ env.FIRMWARE_URL }}" || \
          wget --progress=bar:force -O firmware.zip "${{ env.FIRMWARE_URL }}" || \
          curl -L -o firmware.zip "${{ env.FIRMWARE_URL }}"
          
          ls -lh firmware.zip

      - name: Extract firmware with dumpyara
        run: |
          cd $HOME/dumpyara
          python3 -m dumpyara firmware.zip
          
          echo "Firmware extracted to:"
          ls -la $HOME/dumpyara/firmware/

      - name: Generate device tree with aospdtgen
        run: |
          cd $HOME/dumpyara
          python3 -m aospdtgen $HOME/dumpyara/firmware -o $HOME/dumpyara/deviceTree
          
          echo "Device tree generated at:"
          ls -la $HOME/dumpyara/deviceTree/

      - name: Detect firmware codename and setup device tree
        run: |
          # aospdtgen uses codename from firmware build.prop (e.g., FULL-64)
          # We need to detect it from the generated files
          
          DT_SRC=$HOME/dumpyara/deviceTree
          
          # Extract codename from extract-files.py namespace_imports
          # Format: namespace_imports = ['device/infinix/FULL-64']
          if [ -f "$DT_SRC/extract-files.py" ]; then
            FIRMWARE_CODENAME=$(grep -oP "device/infinix/\K[^']+" "$DT_SRC/extract-files.py" | head -1)
          fi
          
          # Fallback: extract from AndroidProducts.mk
          if [ -z "$FIRMWARE_CODENAME" ] && [ -f "$DT_SRC/AndroidProducts.mk" ]; then
            FIRMWARE_CODENAME=$(grep -oP "PRODUCT_NAME := lineage_\K[^-]+" "$DT_SRC/AndroidProducts.mk" | head -1)
          fi
          
          # Final fallback
          if [ -z "$FIRMWARE_CODENAME" ]; then
            FIRMWARE_CODENAME="FULL-64"
          fi
          
          echo "Detected firmware codename: $FIRMWARE_CODENAME"
          echo "FIRMWARE_CODENAME=$FIRMWARE_CODENAME" >> $GITHUB_ENV
          
          # Create device tree at the location extract-files.py expects
          # namespace_imports = ['device/infinix/FULL-64']
          mkdir -p $HOME/android/lineage/device/infinix/$FIRMWARE_CODENAME
          
          # Copy all generated files
          cp -r $DT_SRC/* $HOME/android/lineage/device/infinix/$FIRMWARE_CODENAME/
          
          echo "Device tree created at:"
          ls -la $HOME/android/lineage/device/infinix/$FIRMWARE_CODENAME/

      - name: Run extract-files.py
        run: |
          DEVICE_PATH=$HOME/android/lineage/device/infinix/$FIRMWARE_CODENAME
          
          echo "Device tree location: $DEVICE_PATH"
          echo "Contents:"
          ls -la $DEVICE_PATH/
          
          # Create vendor directory for extract-files.py output
          mkdir -p $HOME/android/lineage/vendor/infinix/$FIRMWARE_CODENAME
          
          if [ -f "$DEVICE_PATH/extract-files.py" ]; then
            echo "Running extract-files.py..."
            chmod +x "$DEVICE_PATH/extract-files.py"
            
            cd $DEVICE_PATH
            
            # The shebang sets PYTHONPATH=../../../tools/extract-utils
            # which correctly resolves to ~/android/lineage/tools/extract-utils
            ./extract-files.py $HOME/dumpyara/firmware
            
            echo "extract-files.py completed"
          else
            echo "ERROR: extract-files.py not found!"
            exit 1
          fi

      - name: Verify extraction results
        run: |
          echo "Checking vendor extraction results:"
          ls -la $HOME/android/lineage/vendor/infinix/$FIRMWARE_CODENAME/ 2>/dev/null || echo "Vendor directory empty or not created"
          
          echo "Checking device tree:"
          ls -la $HOME/android/lineage/device/infinix/$FIRMWARE_CODENAME/ 2>/dev/null || echo "Device tree not found"

      - name: Package outputs
        run: |
          cd $HOME/android/lineage
          
          # Package device tree and vendor files
          tar -czf ${{ github.workspace }}/device-tree-$FIRMWARE_CODENAME.tar.gz device/ vendor/ 2>/dev/null || \
          tar -czf ${{ github.workspace }}/device-tree-$FIRMWARE_CODENAME.tar.gz device/
          
          # Also package firmware dump for reference
          cd $HOME/dumpyara
          tar -czf ${{ github.workspace }}/firmware-dump-$FIRMWARE_CODENAME.tar.gz firmware/ --exclude="firmware.zip" 2>/dev/null || true
          
          ls -lh ${{ github.workspace }}/*.tar.gz

      - name: Upload device tree artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-tree-${{ env.FIRMWARE_CODENAME }}
          path: ${{ github.workspace }}/device-tree-*.tar.gz
          retention-days: 30
          if-no-files-found: warn

      - name: Upload firmware dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-dump-${{ env.FIRMWARE_CODENAME }}
          path: ${{ github.workspace }}/firmware-dump-*.tar.gz
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        run: |
          echo "=========================================="
          echo "DEVICE TREE GENERATION COMPLETE"
          echo "=========================================="
          echo "Firmware codename: $FIRMWARE_CODENAME"
          echo ""
          echo "Output location: ~/android/lineage/"
          echo "  Device: device/infinix/$FIRMWARE_CODENAME/"
          echo "  Vendor: vendor/infinix/$FIRMWARE_CODENAME/"
          echo ""
          echo "Files generated:"
          find $HOME/android/lineage/device/infinix/$FIRMWARE_CODENAME/ -type f -name "*.mk" -o -name "*.py" -o -name "*.txt" | head -10
          echo ""
          echo "To use this device tree:"
          echo "1. Extract the artifact in your LineageOS source tree"
          echo "2. cd device/infinix/$FIRMWARE_CODENAME"
          echo "3. source build/envsetup.sh"
          echo "4. lunch lineage_$FIRMWARE_CODENAME-userdebug"
          echo "=========================================="
          
